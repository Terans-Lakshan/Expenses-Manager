<!doctype html>
<!--
  EXPENSE MANAGER — clickable UI prototype + build spec

  For Claude Code (or any developer) building the real app from this file:
  1. Read the JSON in <script id="app-spec"> — design tokens, categories, data model,
     period rules and the feature list for every screen.
  2. Each screen's exact layout is in <template id="tpl-<ScreenId>"> (plain HTML with
     inline styles: sizes, colours, radii, spacing). {{name}} holes are filled from that
     screen's renderVals() in REGISTRY["<ScreenId>"], which also holds its sample data
     and interactions (period filters, toggles, category selection).
  3. Category icons: <template id="tpl-CatIcon"> (24x24 stroke SVG paths).
  4. Open this file in a browser to click through it (Prototype view) or see all screens.

  Suggested prompt: "Build this expense manager app from expense-manager-prototype.html.
  Match the screens, design tokens and features in the app-spec JSON; replace the sample
  data with a local database."
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Manager — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap">
<style>
  :root { --page: #E4E8EE; --ink: #0F1B2D; --muted: #5A6575; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); font-family: 'Manrope', system-ui, sans-serif; color: var(--ink); }
  .scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
  button, input { font-family: inherit; }
  input::placeholder { color: #6B7584; }
  .screen a { color: #1D5FCC; } .screen a:hover { color: #164AA0; }

  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(228,232,238,0.92); backdrop-filter: blur(8px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #D5DBE3; }
  .brand { font-family: 'Sora', system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .seg { display: flex; gap: 4px; padding: 4px; background: #D5DBE3; border-radius: 12px; }
  .seg button { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #3B4A5E; font-weight: 700; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 3px rgba(15,27,45,0.12); }

  .phone { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; background: #F2F4F7;
    box-shadow: 0 0 0 10px #0F1B2D, 0 30px 60px rgba(15,27,45,0.25); flex-shrink: 0; }
  .proto { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; padding: 40px 24px 60px; }
  .side { width: 260px; display: flex; flex-direction: column; gap: 6px; }
  .side h2 { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .side button { text-align: left; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid transparent; background: transparent; font-weight: 700; font-size: 15px; color: var(--ink); cursor: pointer; }
  .side button:hover { background: #F2F4F7; }
  .side button[aria-current="true"] { background: #FFFFFF; border-color: #D5DBE3; }
  .side p { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 12px 4px 0; }

  .grid { display: flex; flex-wrap: wrap; gap: 56px 48px; justify-content: center; padding: 48px 24px 80px; }
  .grid figure { margin: 0; display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .grid figcaption { font-weight: 800; font-size: 15px; }

  .spec { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
  .spec pre { background: #FFFFFF; border: 1px solid #D5DBE3; border-radius: 16px; padding: 20px; overflow: auto; font-size: 12.5px; line-height: 1.55; }
  [hidden] { display: none !important; }
  @media (max-width: 460px) { .phone { transform: scale(0.88); transform-origin: top center; margin-bottom: -100px; } }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Expense Manager</span>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="proto" aria-pressed="true">Prototype</button>
    <button type="button" data-view="grid" aria-pressed="false">All screens</button>
    <button type="button" data-view="spec" aria-pressed="false">Build spec</button>
  </div>
</header>

<section id="view-proto" class="proto">
  <nav class="side" aria-label="Screens"><h2>Screens</h2><div id="side-list" style="display:flex;flex-direction:column;gap:6px"></div>
    <p>Tap the bottom tabs, the + button and links inside the phone to move between screens. Filters, toggles and category picks respond.</p>
  </nav>
  <div class="phone"><div id="proto-host" class="screen"></div></div>
</section>
<section id="view-grid" class="grid" hidden></section>
<section id="view-spec" class="spec" hidden><pre id="spec-text"></pre></section>

<template id="tpl-Main">
<div style="width: 390px; height: 844px; background: #F2F4F7; display: flex; flex-direction: column; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #0F1B2D">
<main class="scroll" style="flex: 1; overflow-y: auto; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #5A6575">Wednesday, 28 October</span>
<h1 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Overview</h1>
</div>
<div style="display: flex; gap: 8px">
<a href="Transactions.dc.html" aria-label="Search transactions" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E7ED; display: flex; align-items: center; justify-content: center; color: #0F1B2D; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></a>
<a href="Settings.dc.html" aria-label="Reminders" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E7ED; display: flex; align-items: center; justify-content: center; color: #0F1B2D; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></a>
</div>
</header>

<div role="tablist" aria-label="Period" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3E7ED; border-radius: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Previous period" style="width: 44px; height: 44px; border: 0; background: transparent; color: #0F1B2D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="font-size: 15px; font-weight: 700">{{p.range}}</span>
<button aria-label="Next period" style="width: 44px; height: 44px; border: 0; background: transparent; color: #0F1B2D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<section aria-label="Balance" style="background: #0F1B2D; color: #FFFFFF; border-radius: 24px; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #B7C1D0">Net balance · {{p.short}}</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">{{p.net}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: rgba(255,255,255,0.08); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #9EC2FF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>Income</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-size: 17px; font-weight: 600">{{p.income}}</span>
</div>
<div style="background: rgba(255,255,255,0.08); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #FFB48C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>Expenses</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-size: 17px; font-weight: 600">{{p.expense}}</span>
</div>
</div>
</section>

<a href="Budgets.dc.html" style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #0F1B2D">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; font-weight: 700">{{p.budgetLabel}}</span>
<span style="font-size: 13px; font-weight: 700; color: #5A6575">{{p.pct}}% used</span>
</div>
<div style="height: 8px; border-radius: 99px; background: #E3E7ED; overflow: hidden"><div style="height: 100%; width: {{p.pct}}%; border-radius: 99px; background: {{p.barColor}}"></div></div>
<span style="font-size: 13px; font-weight: 600; color: #5A6575">{{p.budgetNote}}</span>
</a>

<section aria-label="Transactions" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Transactions</h2>
<a href="Transactions.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; padding: 12px 0">See all</a>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 6px 14px; display: flex; flex-direction: column">
<sc-for list="{{p.items}}" as="it" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: {{it.border}}">
<dc-import name="CatIcon" kind="{{it.cat}}" size="{{ 44 }}" hint-size="44px,44px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
<span style="font-size: 12px; font-weight: 600; color: #5A6575">{{it.sub}}</span>
</div>
<span style="font-family: 'Sora', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: {{it.color}}; white-space: nowrap">{{it.amount}}</span>
</div>
</sc-for>
</div>
</section>
</main>

<nav aria-label="Main" style="flex-shrink: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E7ED; display: flex; align-items: flex-start; justify-content: space-around; padding: 8px 8px 0; box-sizing: border-box">
<a href="Main.dc.html" aria-current="page" style="width: 64px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F1B2D; font-size: 11px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>

        bars: [['J', 185000, 140000], ['F', 185000, 105000], ['M', 185000, 108000], ['A', 200000, 116000], ['M', 185000, 128400], ['J', 192000, 112000], ['J', 185000, 106000], ['A', 210000, 133670], ['S', 185000, 124800], ['O', 200000, 112430], ['N', 0, 0], ['D', 0, 0]],

      }

      };

    });
    var net = s.income - s.expense;
    var rate = Math.round(net / s.income * 100);
    var axisLabel = function (n) { return Math.round(n / 1000) + 'k'; };
    var tabs = [['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(function (t) {

  }

})();

<script>
(function () {
  var SCREENS = [["Main", "Home"], ["Transactions", "Records"], ["AddTransaction", "Add expense / income"], ["Reports", "Reports & graphs"], ["Budgets", "Budgets"], ["Categories", "Categories"], ["Settings", "More & settings"]];
  /* Prototype view: one phone, links navigate, each screen keeps its state */
  var protoHost = document.getElementById('proto-host'), sideList = document.getElementById('side-list');
  var protoMounts = {}, current = null;
  function go(name) {
    if (!REGISTRY[name]) return;
    if (!protoMounts[name]) {
      var m = document.createElement('div'); protoHost.appendChild(m);
      protoMounts[name] = m; new Host(name, m, go);
    }
    Object.keys(protoMounts).forEach(function (k) { protoMounts[k].hidden = k !== name; });
    current = name;
    sideList.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.screen === name ? 'true' : 'false'); });
  }
  SCREENS.forEach(function (s) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = s[1]; b.dataset.screen = s[0];
    b.addEventListener('click', function () { go(s[0]); }); sideList.appendChild(b);
  });
  go('Main');

  /* All screens view */
  var grid = document.getElementById('view-grid'), built = false;
  function buildGrid() {
    if (built) return; built = true;
    SCREENS.forEach(function (s) {
      var f = document.createElement('figure'); f.id = 'shot-' + s[0];
      var cap = document.createElement('figcaption'); cap.textContent = s[1];
      var ph = document.createElement('div'); ph.className = 'phone';
      var m = document.createElement('div'); m.className = 'screen'; ph.appendChild(m);
      f.appendChild(cap); f.appendChild(ph); grid.appendChild(f);
      new Host(s[0], m, function (target) { var t = document.getElementById('shot-' + target); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    });
  }
  document.getElementById('spec-text').textContent = JSON.stringify(JSON.parse(document.getElementById('app-spec').textContent), null, 2);

  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.dataset.view;
      if (v === 'grid') buildGrid();
      document.querySelectorAll('[data-view]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      ['proto', 'grid', 'spec'].forEach(function (k) { document.getElementById('view-' + k).hidden = k !== v; });
    });
  });
})();
</script>
